<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Image Gallery | Week 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <p class="tag">WEEK 2 • CSS + BASIC JAVASCRIPT</p>
    <h1>Interactive Image Gallery</h1>
    <p>Hover over an image and click it to open a larger lightbox view.</p>
  </header>

  <main class="container">
    <section class="gallery" id="gallery" aria-label="Image gallery">
      <article class="gallery-item">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=85" alt="Mountain landscape">
        <div class="caption">Mountain Escape</div>
      </article>
      <article class="gallery-item">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=85" alt="Beach and ocean">
        <div class="caption">Ocean Breeze</div>
      </article>
      <article class="gallery-item">
        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=85" alt="Green lake landscape">
        <div class="caption">Green Valley</div>
      </article>
      <article class="gallery-item">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=85" alt="Forest trees">
        <div class="caption">Forest Walk</div>
      </article>
      <article class="gallery-item">
        <img src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=900&q=85" alt="Sunlight through forest">
        <div class="caption">Golden Woods</div>
      </article>
      <article class="gallery-item">
        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=85" alt="Snowy mountains">
        <div class="caption">Snow Peaks</div>
      </article>
      <article class="gallery-item">
        <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=85" alt="Road through landscape">
        <div class="caption">Open Road</div>
      </article>
      <article class="gallery-item">
        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=85" alt="Lake surrounded by mountains">
        <div class="caption">Peaceful Lake</div>
      </article>
    </section>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="close-btn" id="closeBtn" aria-label="Close image viewer">&times;</button>
    <button class="nav-btn prev" id="prevBtn" aria-label="Previous image">&#10094;</button>

    <div class="lightbox-content">
      <img id="lightboxImage" src="" alt="">
      <div class="lightbox-info">
        <h2 id="lightboxTitle"></h2>
        <p id="imageCounter"></p>
      </div>
    </div>

    <button class="nav-btn next" id="nextBtn" aria-label="Next image">&#10095;</button>
  </div>

  <footer>
    <p>Week 2 Internship Project • HTML • CSS • JavaScript</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
